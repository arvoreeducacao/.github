name: gitleaks

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - name: Require a pull request or merge queue event
        if: env.BASE_SHA == '' || env.HEAD_SHA == ''
        run: |
          echo "::error::gitleaks scans pull_request and merge_group events only, got ${GITHUB_EVENT_NAME}"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL --retry 3 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan pull request commits
        run: |
          "${RUNNER_TEMP}/gitleaks" git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 \
            .
